<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Credentials | NarcoTrack BD</title>
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>
    <header class="navbar">
        <div class="logo">NarcoTrack BD</div>
        <nav>
            <a href="index.html">Home</a>
        </nav>
    </header>

    <!-- CONTENT -->
    <main class="login-wrapper">
        <div class="login-card">
            <h2>Create Login Credentials</h2>
            <p class="subtext">
                Set your username and password.
                Account will be pending admin approval.
            </p>

            <form id="bgbCredentialsForm" method="POST" action="bgb-credentials.php">
                <label>Username</label>
                <input type="text" name="username" id="username" required>

                <label>Password</label>
                <input type="password" name="password" id="password" required>

                <label>Confirm Password</label>
                <input type="password" name="confirm_password" id="confirmPassword" required>

                <button class="btn primary full" type="submit">
                    Submit
                </button>
            </form>
        </div>
    </main>

    <script src="js/bgb-credentials.js"></script>
</body>

</html>
