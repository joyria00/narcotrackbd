    <div class="logo">NarcoTrack BD</div>
    <nav>
      <a href="index.php">Home</a>
    </nav>
  </header>

  <main class="login-wrapper">
    <div class="login-card">
      <h2>DNC Officer Details</h2>

      <form id="dncDetailsForm" method="POST" action="dnc-details.php">

        <label>Designation</label>
        <input type="text" id="designation" value="" readonly>

        <label>Full Name</label>
        <input type="text" name="full_name" required>

        <label>DNC Badge / Force ID</label>
        <input type="text" name="badge_number" required>

        <label>Posting Unit / Wing</label>
        <input type="text" name="posting_unit" placeholder="e.g. Dhaka Metro Unit" required>

        <label>Official Email</label>
        <input type="email" name="email" required>

        <label>Phone Number</label>
        <input type="tel" name="phone" required>

        <button type="submit" class="btn primary full">Next</button>
      </form>
    </div>
  </main>
